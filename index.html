<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <p id="rights">Made by krunal with ❤︎</p>
        <div class="cover"></div>

        <div class="controls">
            <div class="song-info">
                <h2>Blinding Lights</h2>
                <p>The Weeknd</p>
            </div>

            <div class="progress-wrap">
                <input type="range" class="progress" value="0" min="0" step="1">
                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <audio id="audio"></audio>

                <button id="repeat" class="control-btn small-btn" aria-label="Repeat">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    <span class="repeat-dot"></span>
                </button>

                <button id="back" class="control-btn" aria-label="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button id="play" class="control-btn play-btn" aria-label="Play">
                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>

                <button id="next" class="control-btn" aria-label="Next">
                    <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
                </button>

                <button id="mute" class="control-btn small-btn" aria-label="Mute">
                    <svg class="icon-vol-on" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
                    <svg class="icon-vol-off" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.02l2.45 2.45c.03-.15.05-.3.05-.44zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.965 8.965 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06A6.995 6.995 0 0 1 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.94 8.94 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4l-1.88 1.88L12 7.76V4z"/></svg>
                </button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
